apiVersion: v3.1.0
kind: DataContract
id: ori-quality-gold-detail-records-v1
name: Detail records
version: 0.1.0
status: draft
domain: ori-quality
dataProduct: ori_quality_monitor
description:
  purpose: >-
    Feeds the record tables behind the charts, including "Export CSV": the individual records that need
    attention, with per source which fields are missing.
  usage: ORI Quality Monitoring dashboard. Read-only.
  limitations: >-
    Best-guess contract. This table does not exist yet in the sprouts-dev catalog. Columns follow the
    ORI Quality Monitoring prototype (ori-dashboard.lovable.app). Can grow large; partition by organisation_ror_id
    and primary_source so the UI only reads one slice.
customProperties:
- property: dashboardTab
  value: Coverage, Completeness
- property: prototypeDataset
  value: Detail records
- property: presentInSproutsDev
  value: false
team:
  name: ori-quality-monitoring-team
schema:
- name: detail_records
  physicalType: table
  properties:
  - name: organisation_abbreviation
    logicalType: string
    physicalType: VARCHAR
    required: true
    businessName: filterOrganisationAbbreviation
    description: Short name of the organisation, as shown in the filter bar.
    examples:
    - VU Amsterdam
  - name: organisation_ror_id
    logicalType: string
    physicalType: VARCHAR
    required: true
    businessName: filterOrganisationRorId
    description: ROR ID of the organisation without resolver prefix.
    examples:
    - 008xxew50
  - name: primary_source
    logicalType: string
    physicalType: VARCHAR
    required: true
    businessName: filterPrimarySource
    description: Source selected as primary. One of CRIS, OpenAlex, OpenAIRE, Crossref.
  - name: entity_table
    logicalType: string
    physicalType: VARCHAR
    required: true
    businessName: filterEntityTable
    description: Entity type. Currently only Publications.
  - name: publication_type
    logicalType: string
    physicalType: VARCHAR
    required: true
    businessName: filterType
    description: Publication type filter. 'All Types' rows hold the pre-aggregated total over all types.
  - name: id
    logicalType: string
    physicalType: VARCHAR
    required: true
    businessName: id
    description: Record ID in the primary source.
  - name: title
    logicalType: string
    physicalType: VARCHAR
    required: true
    businessName: title
    description: Title.
  - name: doi
    logicalType: string
    physicalType: VARCHAR
    businessName: doi
    description: DOI without resolver prefix. Null if absent.
  - name: authors
    logicalType: string
    physicalType: VARCHAR
    required: true
    businessName: authors
    description: Author list for display, as "Family, I.; Family, I.".
  - name: year
    logicalType: integer
    physicalType: INTEGER
    businessName: year
    description: Publication year.
  - name: sources
    logicalType: array
    physicalType: VARCHAR[]
    required: true
    businessName: sources
    description: Sources in which the record was found.
    items:
      logicalType: string
  - name: missing_fields_by_source
    logicalType: array
    physicalType: STRUCT(source VARCHAR, fields VARCHAR[])[]
    required: true
    businessName: missingFieldsBySource
    description: Per source, the fields that are missing for this record.
    items:
      logicalType: object
      properties:
      - name: source
        logicalType: string
        description: Source name.
      - name: fields
        logicalType: array
        description: Missing fields.
        items:
          logicalType: string
  quality:
  - type: sql
    description: One row per organisation_ror_id, primary_source, entity_table, publication_type, id.
    query: >-
      SELECT COUNT(*) FROM (SELECT organisation_ror_id, primary_source, entity_table, publication_type,
      id FROM detail_records GROUP BY ALL HAVING COUNT(*) > 1)
    mustBe: 0
  - type: sql
    description: Only agreed source names.
    query: >-
      SELECT COUNT(*) FROM detail_records WHERE primary_source NOT IN ('CRIS','OpenAlex','OpenAIRE','Crossref')
    mustBe: 0
slaProperties:
- property: latency
  value: 7
  unit: d
servers:
- server: development
  type: s3
  endpointUrl: https://objectstore.surf.nl
  location: s3://sprouts-dev/ori_quality/gold/detail_records/*.parquet
  format: parquet
