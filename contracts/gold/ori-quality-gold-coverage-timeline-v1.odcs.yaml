apiVersion: v3.1.0
kind: DataContract
id: ori-quality-gold-coverage-timeline-v1
name: Coverage timeline
version: 0.1.0
status: draft
domain: ori-quality
dataProduct: ori_quality_monitor
description:
  purpose: >-
    Feeds the coverage timeline in the detail view: per snapshot quarter, the share of records only in
    primary, in both, and only in the compared source.
  usage: ORI Quality Monitoring dashboard. Read-only.
  limitations: >-
    Best-guess contract. This table does not exist yet in the sprouts-dev catalog. Columns follow the
    ORI Quality Monitoring prototype (ori-dashboard.lovable.app).
customProperties:
- property: dashboardTab
  value: Coverage
- property: prototypeDataset
  value: Coverage timeline
- property: presentInSproutsDev
  value: false
team:
  name: ori-quality-monitoring-team
schema:
- name: coverage_timeline
  physicalType: table
  properties:
  - name: organisation_abbreviation
    logicalType: string
    physicalType: VARCHAR
    required: true
    businessName: filterOrganisationAbbreviation
    description: Short name of the organisation, as shown in the filter bar.
    examples:
    - VU Amsterdam
  - name: organisation_ror_id
    logicalType: string
    physicalType: VARCHAR
    required: true
    businessName: filterOrganisationRorId
    description: ROR ID of the organisation without resolver prefix.
    examples:
    - 008xxew50
  - name: primary_source
    logicalType: string
    physicalType: VARCHAR
    required: true
    businessName: filterPrimarySource
    description: Source selected as primary. One of CRIS, OpenAlex, OpenAIRE, Crossref.
  - name: entity_table
    logicalType: string
    physicalType: VARCHAR
    required: true
    businessName: filterEntityTable
    description: Entity type. Currently only Publications.
  - name: publication_type
    logicalType: string
    physicalType: VARCHAR
    required: true
    businessName: filterType
    description: Publication type filter. 'All Types' rows hold the pre-aggregated total over all types.
  - name: compare_source
    logicalType: string
    physicalType: VARCHAR
    required: true
    businessName: compareSource
    description: Source compared against the primary source.
  - name: date
    logicalType: string
    physicalType: VARCHAR
    required: true
    businessName: date
    description: Quarter of the harvest or snapshot, as YYYY-Qn.
  - name: in_both
    logicalType: number
    physicalType: DOUBLE
    required: true
    businessName: inBoth
    description: Share of records in both sources, in percent.
  - name: only_in_primary
    logicalType: number
    physicalType: DOUBLE
    required: true
    businessName: onlyInPrimary
    description: Share only in the primary source, in percent.
  - name: only_in_compared
    logicalType: number
    physicalType: DOUBLE
    required: true
    businessName: onlyInCompared
    description: Share only in the compared source, in percent.
  quality:
  - type: sql
    description: One row per organisation_ror_id, primary_source, entity_table, publication_type, compare_source,
      date.
    query: >-
      SELECT COUNT(*) FROM (SELECT organisation_ror_id, primary_source, entity_table, publication_type,
      compare_source, date FROM coverage_timeline GROUP BY ALL HAVING COUNT(*) > 1)
    mustBe: 0
  - type: sql
    description: Shares add up to 100 (rounding margin 0.5).
    query: >-
      SELECT COUNT(*) FROM coverage_timeline WHERE abs(in_both + only_in_primary + only_in_compared -
      100) > 0.5
    mustBe: 0
  - type: sql
    description: Quarter format YYYY-Qn.
    query: >-
      SELECT COUNT(*) FROM coverage_timeline WHERE NOT regexp_matches(date, '^[0-9]{4}-Q[1-4]$')
    mustBe: 0
  - type: sql
    description: Only agreed source names.
    query: >-
      SELECT COUNT(*) FROM coverage_timeline WHERE primary_source NOT IN ('CRIS','OpenAlex','OpenAIRE','Crossref')
      OR compare_source NOT IN ('CRIS','OpenAlex','OpenAIRE','Crossref')
    mustBe: 0
slaProperties:
- property: latency
  value: 7
  unit: d
servers:
- server: development
  type: s3
  endpointUrl: https://objectstore.surf.nl
  location: s3://sprouts-dev/ori_quality/gold/coverage_timeline/*.parquet
  format: parquet
