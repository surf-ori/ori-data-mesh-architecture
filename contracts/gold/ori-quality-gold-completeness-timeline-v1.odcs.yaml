apiVersion: v3.1.0
kind: DataContract
id: ori-quality-gold-completeness-timeline-v1
name: Completeness timeline
version: 0.1.0
status: draft
domain: ori-quality
dataProduct: ori_quality_monitor
description:
  purpose: >-
    Feeds the "Completeness progress over time" chart: one line per metadata field. The time axis is the
    harvest date (CRIS) or snapshot release date (OpenAlex, OpenAIRE, Crossref), per quarter, not the
    publication year.
  usage: ORI Quality Monitoring dashboard. Read-only.
  limitations: >-
    Best-guess contract. This table does not exist yet in the sprouts-dev catalog. Columns follow the
    ORI Quality Monitoring prototype (ori-dashboard.lovable.app).
customProperties:
- property: dashboardTab
  value: Completeness
- property: prototypeDataset
  value: Completeness timeline
- property: presentInSproutsDev
  value: false
team:
  name: ori-quality-monitoring-team
schema:
- name: completeness_timeline
  physicalType: table
  properties:
  - name: organisation_abbreviation
    logicalType: string
    physicalType: VARCHAR
    required: true
    businessName: filterOrganisationAbbreviation
    description: Short name of the organisation, as shown in the filter bar.
    examples:
    - VU Amsterdam
  - name: organisation_ror_id
    logicalType: string
    physicalType: VARCHAR
    required: true
    businessName: filterOrganisationRorId
    description: ROR ID of the organisation without resolver prefix.
    examples:
    - 008xxew50
  - name: primary_source
    logicalType: string
    physicalType: VARCHAR
    required: true
    businessName: filterPrimarySource
    description: Source selected as primary. One of CRIS, OpenAlex, OpenAIRE, Crossref.
  - name: entity_table
    logicalType: string
    physicalType: VARCHAR
    required: true
    businessName: filterEntityTable
    description: Entity type. Currently only Publications.
  - name: publication_type
    logicalType: string
    physicalType: VARCHAR
    required: true
    businessName: filterType
    description: Publication type filter. 'All Types' rows hold the pre-aggregated total over all types.
  - name: field
    logicalType: string
    physicalType: VARCHAR
    required: true
    businessName: field
    description: Metadata field, same values as completeness_metrics.
  - name: date
    logicalType: string
    physicalType: VARCHAR
    required: true
    businessName: date
    description: Quarter of the harvest or snapshot, as YYYY-Qn.
    examples:
    - 2023-Q4
  - name: value
    logicalType: number
    physicalType: DOUBLE
    required: true
    businessName: value
    description: Completeness percentage in that snapshot.
  quality:
  - type: sql
    description: One row per organisation_ror_id, primary_source, entity_table, publication_type, field,
      date.
    query: >-
      SELECT COUNT(*) FROM (SELECT organisation_ror_id, primary_source, entity_table, publication_type,
      field, date FROM completeness_timeline GROUP BY ALL HAVING COUNT(*) > 1)
    mustBe: 0
  - type: sql
    description: Quarter format YYYY-Qn.
    query: >-
      SELECT COUNT(*) FROM completeness_timeline WHERE NOT regexp_matches(date, '^[0-9]{4}-Q[1-4]$')
    mustBe: 0
  - type: sql
    description: Value between 0 and 100.
    query: >-
      SELECT COUNT(*) FROM completeness_timeline WHERE value NOT BETWEEN 0 AND 100
    mustBe: 0
  - type: sql
    description: Only agreed source names.
    query: >-
      SELECT COUNT(*) FROM completeness_timeline WHERE primary_source NOT IN ('CRIS','OpenAlex','OpenAIRE','Crossref')
    mustBe: 0
slaProperties:
- property: latency
  value: 7
  unit: d
servers:
- server: development
  type: s3
  endpointUrl: https://objectstore.surf.nl
  location: s3://sprouts-dev/ori_quality/gold/completeness_timeline/*.parquet
  format: parquet
